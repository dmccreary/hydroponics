<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>HACCP Risk Matrix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; }
        main { display: block; position: relative; }
        #plan-popup {
            position: absolute;
            display: none;
            background: #ffffff;
            border: 2px solid #2e7d32;
            border-radius: 6px;
            padding: 12px 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            font-size: 12px;
            max-width: 560px;
            max-height: 440px;
            overflow: auto;
            z-index: 10;
        }
        #plan-popup h3 { margin: 0 0 6px 0; color: #2e7d32; font-size: 14px; }
        #plan-popup pre { white-space: pre-wrap; margin: 0; font-family: 'Consolas', monospace; font-size: 11px; }
        #plan-popup .row { margin-top: 8px; text-align: right; }
        #plan-popup button {
            background: #00bcd4; color: white; border: none; padding: 4px 10px;
            border-radius: 3px; cursor: pointer; font-size: 12px; margin-left: 6px;
        }
        #plan-popup button.close { background: #757575; }
    </style>
</head>
<body>
    <main>
        <div id="plan-popup">
            <h3>HACCP Plan Summary</h3>
            <pre id="plan-text"></pre>
            <div class="row">
                <button id="plan-copy">Copy</button>
                <button class="close" id="plan-close">Close</button>
            </div>
        </div>
    </main>
    <script src="haccp-risk-matrix.js"></script>
</body>
</html>
