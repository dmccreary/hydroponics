<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Biomass Growth Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; color: #212529; padding: 8px; }
        h1 { font-size: 16px; margin-bottom: 6px; color: #2e7d32; }
        .row { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .chart-box { background: white; border: 1px solid #dee2e6; border-radius: 4px; padding: 8px; height: 290px; position: relative; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
        .panel { background: white; border: 1px solid #dee2e6; border-radius: 4px; padding: 10px; }
        h2 { font-size: 13px; color: #00796b; margin-bottom: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 4px 6px; border-bottom: 1px solid #e9ecef; text-align: right; }
        th:first-child, td:first-child { text-align: left; }
        input[type="number"] { width: 70px; padding: 2px 4px; border: 1px solid #ced4da; border-radius: 3px; font-size: 12px; text-align: right; }
        button { background: #2e7d32; color: white; border: none; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; margin-right: 4px; margin-top: 4px; }
        button.secondary { background: #00796b; }
        button.warn { background: #d32f2f; }
        .target { margin-top: 8px; font-size: 12px; }
        .target label { display: block; margin-bottom: 4px; color: #495057; }
        .result-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; border-bottom: 1px solid #f1f3f5; }
        .result-row b { color: #2e7d32; }
        .progress { background: #e9ecef; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 6px; }
        .progress > div { background: linear-gradient(90deg, #4caf50, #2e7d32); height: 100%; transition: width 0.3s; }
        .toggle { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Biomass Growth Tracker</h1>
    <div class="row">
        <div class="chart-box"><canvas id="growthChart"></canvas></div>
        <div class="grid">
            <div class="panel">
                <h2>Measurements</h2>
                <table id="dataTable">
                    <thead>
                        <tr><th>Day</th><th>Fresh (g)</th><th>Dry (g)</th><th></th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <div>
                    <button id="addRow">+ Add Row</button>
                    <button id="loadExample" class="secondary">Load Example</button>
                    <button id="clearData" class="warn">Clear</button>
                </div>
                <div class="target">
                    <label>Target harvest weight (g): <input type="number" id="targetWeight" value="120" min="1" step="1"></label>
                </div>
                <div class="toggle">
                    <input type="checkbox" id="showTrend" checked>
                    <label for="showTrend">Show trend line</label>
                </div>
            </div>
            <div class="panel">
                <h2>Calculated Results</h2>
                <div id="results"></div>
                <div class="progress"><div id="progressBar" style="width:0%"></div></div>
                <div id="progressLabel" style="font-size:11px; color:#6c757d; margin-top:4px"></div>
            </div>
        </div>
    </div>
    <script src="biomass-growth-tracker.js"></script>
</body>
</html>
